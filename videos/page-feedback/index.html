<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0d1117;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1920"
      data-height="1080"
    >
      <div id="el-00-context" class="scene" data-composition-id="00-context" data-composition-src="compositions/frames/00-context.html" data-start="0" data-duration="10" data-track-index="1"></div>

      <div
        id="el-01-annotate"
        class="scene"
        data-composition-id="01-annotate"
        data-composition-src="compositions/frames/01-annotate.html"
        data-start="10"
        data-duration="14"
        data-track-index="1"
      ></div>

      <div
        id="el-02-handoff"
        class="scene"
        data-composition-id="02-handoff"
        data-composition-src="compositions/frames/02-handoff.html"
        data-start="24"
        data-duration="16"
        data-track-index="1"
      ></div>

      <video id="annotate-video" src="assets/annotation.webm" preload="auto" muted playsinline
        class="clip"
        style="position:absolute;left:80px;top:112px;width:1760px;height:898px;object-fit:contain"
        data-start="10"
        data-duration="14"
        data-track-index="1001"
      ></video>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
