<template>
  <style>

    .annotate-video {

    .annotate-header-separator {

  </style>

  <div id="root" data-composition-id="01-annotate" data-width="1920" data-height="1080" data-duration="14">
    <div id="annotate-ground" class="clip annotate-ground" data-start="0" data-duration="14" data-track-index="0"></div>

    <div class="annotate-video-shell" aria-label="Recorded Page feedback extension interaction">
      <!-- approved frame video hoisted by assemble-index -->
    </div>

    <div class="annotate-header" aria-label="browse-tool Page feedback">
      <span>browse-tool</span>
      <span class="annotate-header-separator"></span>
      <span class="annotate-header-label">Page feedback</span>
    </div>

    <div class="annotate-editorial-band" aria-live="off">
      <p id="annotate-caption" class="annotate-caption">Point to what should change.</p>
      <div class="annotate-footer">Local demo · synthetic page</div>
    </div>
  </div>

  <script>
    (() => {
      const frameId = "01-annotate";
      const video = document.getElementById("annotate-video");
      const caption = document.getElementById("annotate-caption");

      const CONTENT = [
        { title: "Point to what should change.", hold: 4.0 },
        { title: "Leave a note.", hold: 4.9 },
        { title: "Save the comment and screenshot.", hold: 5.1 },
      ];

      let cumulative = 0;
      const TIMELINE = CONTENT.map((entry) => {
        const start = cumulative;
        cumulative += entry.hold;
        return { ...entry, start, end: cumulative };
      });

      const tl = gsap.timeline({ paused: true });
      const driver = { t: 0 };
      let lastTitle = "";

      function entryAt(time) {
        for (let index = TIMELINE.length - 1; index >= 0; index -= 1) {
          if (time >= TIMELINE[index].start) return TIMELINE[index];
        }
        return TIMELINE[0];
      }

      tl.fromTo(
        document.querySelector(".annotate-header"),
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        document.querySelector(".annotate-footer"),
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power3.out" },
        0.15,
      );

      TIMELINE.forEach((entry) => {
        tl.fromTo(
          caption,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
          entry.start,
        );
      });

      tl.to(
        driver,
        {
          t: 14,
          duration: 14,
          ease: "none",
          onUpdate: () => {
            const entry = entryAt(driver.t);
            if (entry.title !== lastTitle) {
              caption.textContent = entry.title;
              lastTitle = entry.title;
            }
          },
        },
        0,
      );
      window.__timelines = window.__timelines || {};
      window.__timelines[frameId] = tl;
    })();
  </script>
